# If you change what runs on a PR here, update RELEASE.md in the SAME PR (step 6
# tells a release which PR-level checks to poll for actual PASS). That runbook has
# no test and no CI, so review is the only thing that catches drift: this workflow
# arrived in #88 and RELEASE.md went on claiming the repo had no PR-level CI for
# 8 days across 3 releases.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx vitest run
      # The no-em-dash convention covers this repo too, but only the dashboard
      # repo enforced it until 2026-07-30. 29 had accumulated here, and one had
      # already shipped in a customer-visible snapshot string (hardware-raid's
      # raw_summary). Comments count: a comment dash is what eventually gets
      # copied into a message.
      - run: npm run lint:emdash
      # Known-bad fixture for the guard above: proves it still FAILS on literal and
      # escaped dashes. Without it the guard only ever proves today's tree is clean,
      # so a no-op regression in the guard itself would stay green. Round 5 #6.
      - run: npm run lint:emdash:test
      - run: npm audit --omit=dev

  # DCO sign-off (round-2 s1.3, 2026-08-24): every PR commit must carry
  # Signed-off-by. Contribution policy is DCO, not CLA; see CONTRIBUTING.md.
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        run: |
          set -euo pipefail
          MISSING=0
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$sha" | grep -Eqi "^Signed-off-by: .+ <.+@.+>"; then
              echo "missing Signed-off-by: $sha $(git log -1 --format=%s "$sha")" >&2
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "Add sign-offs with: git rebase --signoff origin/main (see CONTRIBUTING.md)" >&2
            exit 1
          fi
          echo "all commits signed off"

