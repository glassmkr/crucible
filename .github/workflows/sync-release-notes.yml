# Re-sync a published GitHub Release body from CHANGELOG.md.
#
# publish.yml writes the release body once, at tag time, and then exits early
# on every later run ("Release already exists; nothing to do"). That makes the
# body a COPY of the CHANGELOG section with nothing keeping the two in step, and
# a copy drifts: v1.0.1 shipped with a wrong sentence about signing keys, the
# CHANGELOG was corrected, and the published release kept saying the wrong thing
# because nothing could update it.
#
# This is the missing half. Run it from the Actions tab (Run workflow, pick a
# tag) whenever a CHANGELOG section is corrected after release. No local tooling
# and no credentials: it runs under the repository's own token.
name: Sync release notes from CHANGELOG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to re-sync, e.g. v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    name: Re-sync notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rewrite the release body from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No release $TAG. This syncs an existing release; it does not create one."
            exit 1
          fi

          VERSION="${TAG#v}"
          NOTES="$(mktemp)"
          # Same extraction publish.yml uses, so the two cannot disagree about
          # what "the section for this version" means.
          awk -v head="## [$VERSION]" '
            substr($0,1,3)=="## " { if (started) exit; if (index($0,head)==1){started=1;next} next }
            started { print }
          ' CHANGELOG.md > "$NOTES"

          if [ ! -s "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section, so there is nothing to sync."
            exit 1
          fi

          echo "Body that will be published:"
          echo "----------------------------"
          cat "$NOTES"
          echo "----------------------------"

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
          echo "Release $TAG now matches its CHANGELOG section."
