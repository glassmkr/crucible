name: Secret scan

# Crucible is a PUBLIC repo, so a committed secret is immediately exposed.
# This gate runs gitleaks on every PR and every push to main (Crucible
# release commits land directly on main, not only via PRs). Mirrors the
# dashboard repo's secret-scan workflow.
#
# A scan is scoped to the NEW commits of the event (PR range or push
# range), not full history, so it does not re-fail on pre-existing
# commits that predate it. A manual run (workflow_dispatch) scans the
# whole working tree. Synthetic test keys are allowlisted in
# .gitleaks.toml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (tag-mutation defense); comment shows the semver the SHA
      # resolved to. Bump deliberately.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history so range scans can resolve any base

      # Use the gitleaks BINARY, not gitleaks/gitleaks-action: the action
      # wrapper requires a paid GITLEAKS_LICENSE for GitHub organization
      # accounts and hard-fails at a license check before scanning. The
      # binary is open-source and free. Pinned by version + SHA-256 of the
      # release tarball (don't trust a mutable release asset).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZEROS=0000000000000000000000000000000000000000
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            # Scheduled defense in depth: scan both the current tree and every
            # reachable commit, including material outside incremental ranges.
            gitleaks dir --no-banner --redact --verbose --exit-code 1 .
            gitleaks git --no-banner --redact --verbose --exit-code 1 .
          elif [ -n "${BASE_SHA:-}" ]; then
            # Pull request: scan only the commits this PR adds.
            gitleaks git --no-banner --redact --verbose --exit-code 1 --log-opts="${BASE_SHA}..HEAD" .
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "${PUSH_BEFORE}" != "${ZEROS}" ]; then
            # Push to main: scan only the newly pushed commits.
            gitleaks git --no-banner --redact --verbose --exit-code 1 --log-opts="${PUSH_BEFORE}..HEAD" .
          else
            # First push / force-push / manual run: scan the working tree.
            gitleaks dir --no-banner --redact --verbose --exit-code 1 .
          fi
