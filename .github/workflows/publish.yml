# Release mechanics. If you change how this workflow publishes, what it tags, or
# how it creates the GitHub Release, update RELEASE.md in the SAME PR (steps 6 to
# 8 describe this file). That runbook has no test and no CI, so review is the only
# thing that catches drift: #57 added the auto-created Release here and RELEASE.md
# went on calling it a manual step for 16 days across 11 releases.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build verified package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx vitest run
      - name: Build package artifact
        run: |
          set -euo pipefail
          mkdir -p package
          npm pack --ignore-scripts --pack-destination package
          sha256sum package/*.tgz > package/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: |
            package/*.tgz
            package/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: npm publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        # A v* tag grants this job publish authority; refuse to publish a commit that
        # is not reachable from main (an unmerged/untrusted tag pointed at a modified
        # workflow or package). Pair with a repo tag-protection ruleset restricting
        # who may push v* tags.
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "refusing to publish: ${GITHUB_SHA} is not an ancestor of origin/main" >&2
            exit 1
          fi
          echo "verified: ${GITHUB_SHA} is on origin/main"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 ships with npm 11.x which has working npm Trusted Publishing.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: package
      - run: npm --version
      - name: Verify package artifact
        run: sha256sum -c package/SHA256SUMS
      # Leading ./ forces npm to treat the arg as a local tarball path; a bare
      # package/*.tgz is parsed as a GitHub owner/repo shorthand and fails.
      - run: npm publish ./package/*.tgz --access public --provenance

      # Create the GitHub Release from the tag + its CHANGELOG section, so a
      # release object always exists for every published version. This used to
      # be a manual step in the release flow and got skipped for v0.13.20.
      # Runs only after a successful publish. Idempotent (skips if the release
      # already exists); falls back to autogenerated notes if the CHANGELOG has
      # no matching section.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES="$(mktemp)"
          awk -v head="## [$VERSION]" '
            substr($0,1,3)=="## " { if (started) exit; if (index($0,head)==1){started=1;next} next }
            started { print }
          ' CHANGELOG.md > "$NOTES"
          if [ -s "$NOTES" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$NOTES" --verify-tag --latest
          else
            echo "No CHANGELOG section for $VERSION; using autogenerated notes."
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag --latest
          fi

  # Single-file binaries (no Node.js needed on the installing host), attached
  # to the GitHub Release the publish job creates. Built with bun (see
  # scripts/build-binaries.sh for the toolchain rationale and the version
  # smoke test). GPG signing of SHA256SUMS stays a manual maintainer step
  # (scripts/sign-release.sh); the key never lives in CI.
  binaries:
    name: Build and attach binaries
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: npm ci --ignore-scripts
      - name: Build binaries
        run: ./scripts/build-binaries.sh dist-bin
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
            dist-bin/glassmkr-crucible-linux-x64 \
            dist-bin/glassmkr-crucible-linux-arm64 \
            dist-bin/SHA256SUMS
