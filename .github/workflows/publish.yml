name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 ships with npm 11.x which has working npm Trusted Publishing.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm --version
      - run: npm install
      - run: npm run build
      - run: npm publish --access public --provenance

      # Create the GitHub Release from the tag + its CHANGELOG section, so a
      # release object always exists for every published version. This used to
      # be a manual step in the release flow and got skipped for v0.13.20.
      # Runs only after a successful publish. Idempotent (skips if the release
      # already exists); falls back to autogenerated notes if the CHANGELOG has
      # no matching section.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES="$(mktemp)"
          awk -v head="## [$VERSION]" '
            substr($0,1,3)=="## " { if (started) exit; if (index($0,head)==1){started=1;next} next }
            started { print }
          ' CHANGELOG.md > "$NOTES"
          if [ -s "$NOTES" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$NOTES" --verify-tag --latest
          else
            echo "No CHANGELOG section for $VERSION; using autogenerated notes."
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag --latest
          fi
