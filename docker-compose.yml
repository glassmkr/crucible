# Glassmkr Crucible - docker compose deployment
#
# Before starting, create /etc/glassmkr/crucible.yaml on the host with your
# Dashboard collector key. See https://app.glassmkr.com/docs/getting-started.
# Legacy installs may have the file at /etc/glassmkr/collector.yaml; the
# agent reads either path (preferring the new name).
#
# Why privileged + host network:
# - privileged: true gives access to /dev/ipmi0 (IPMI sensors) and raw disk devices (SMART)
# - network_mode: host lets the agent read the real host network interfaces and bond state
# - the agent reads /proc and /sys at their normal paths; in a privileged
#   host-network container these already expose the host kernel's state,
#   so no remapping mounts are needed

services:
  crucible:
    image: docker.io/glassmkr/crucible:latest
    container_name: glassmkr-crucible
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /etc/glassmkr:/etc/glassmkr:ro
      - /dev:/dev:ro
      - /run/dbus:/run/dbus:ro
